[[forbidden_edge]]
kind = "calls_endpoint"
from = { repo = "computed-routes-ts", path = "src/client.ts", symbol = "getStatus" }
to = { kind = "api_endpoint", repo = "computed-routes-ts", method = "GET", route = "/api/items/:id" }
note = "`status` must not be absorbed by the :id param of a different route prefix: /api/status is a distinct static route, and /api/items/:id requires the items segment"

[[forbidden_edge]]
kind = "calls_endpoint"
from = { repo = "computed-routes-ts", path = "src/client.ts", symbol = "getItemTemplate" }
