[[forbidden_edge]]
kind = "calls_endpoint"
from = { repo = "computed-routes-ts", path = "src/client.ts", symbol = "createItem" }
to = { kind = "api_endpoint", repo = "computed-routes-ts", method = "GET", route = "/api/items/:id" }
