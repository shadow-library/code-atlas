deterministic_claim_allowed = false
note = "equal on integers, different on non-integers and non-finite numbers: isEvenMod(2.5) is false, isEvenBit(2.5) is true (ToInt32 truncates); NaN and Infinity also differ. A plausible but wrong equivalent_to must be rejected."

