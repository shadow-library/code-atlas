[package]
name = "acme-billing"
version = "0.3.0"
edition = "2021"

[workspace]

[lib]
name = "acme_billing"
path = "src/lib.rs"

[[bin]]
name = "acme-billing"
path = "src/main.rs"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
