[[edge]]
kind = "calls_endpoint"
from = { repo = "acme-web", path = "src/hooks/useMe.ts", symbol = "useMe" }
to = { kind = "api_endpoint", repo = "acme-api", method = "GET", route = "/users/:id" }
certainty = ["heuristic"]
min_confidence = 0.4
note = "Runtime-correct: acme-api has no `/users/me` route, and NestJS matches `GET /users/me` against `@Get(\":id\")` with id = \"me\" (there is no static `me` route declared earlier), so the request really lands on UsersController.findOne. A literal segment matching a param segment is a weaker match than a param-for-param match, hence heuristic with low confidence and never resolved. The call is a semantic bug in the web app (it would look up the user \"me\"), which a correct analyzer cannot know."

