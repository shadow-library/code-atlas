version = 1
packages = ["@acme/http"]

[controller]
decorators = ["Api"]

[routes.methods]
Read = "GET"
Write = "POST"

[guards]
decorators = ["Guarded", "Authenticated", "Session"]
auth_schemes = { Authenticated = "bearer", Session = ["bearer", "session_cookie"] }

[permissions]
decorators = ["Permit", "RequireScope"]
auth_schemes = { RequireScope = "bearer" }

[access]
public = ["Public"]
optional = ["OptionalAuth"]

[global_prefix]
factory = "AcmeServer.create"
method = "setGlobalPrefix"

[routes.options]
decorators = ["Route"]

[client]
files = ["src/transport.ts"]
exports = ["ExportsRequest", "kitClient"]

[client.surfaces]
modules = ["@acme/http-kit"]
factory = "createKitClient"
option = "surfaces"
containers = ["kitClient"]
