version = 1
packages = ["@acme/http"]

[controller]
decorators = ["Api"]

[routes.methods]
Read = "GET"
Write = "POST"

[guards]
decorators = ["Guarded", "Authenticated"]
auth_schemes = { Authenticated = "bearer" }

[permissions]
decorators = ["Permit"]

[global_prefix]
factory = "AcmeServer.create"
method = "setGlobalPrefix"
